name: Release Windows

# Publishes a self-contained Windows build (exe + all MinGW/wxWidgets runtime
# DLLs) as a downloadable .zip attached to a GitHub Release. Triggered by
# pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`), and
# also runnable on demand from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.0). Manual runs only.'
        required: false
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            make
            zip
            unzip
            flex
            bison
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-wxwidgets3.2-msw
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-ntldd

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -G "Unix Makefiles" \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build -j

      - name: Stage release files
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/gigasheet.exe release/
          # The app loads appicon.png from next to the exe at runtime.
          if [ -f build/appicon.png ]; then
            cp build/appicon.png release/
          elif [ -f assets/appicon.png ]; then
            cp assets/appicon.png release/
          fi

      - name: Bundle runtime DLLs (recursive closure)
        shell: msys2 {0}
        run: |
          set -eu
          # ntldd -R walks the full recursive PE dependency tree and prints the
          # resolved path of every non-system DLL. This is the robust MSYS2 way
          # to gather everything the exe needs so it runs on a clean Windows box.
          # (grep is kept out of any pipefail path so a no-match never aborts.)
          ntldd -R build/gigasheet.exe \
            | awk '{for (i=1;i<=NF;i++) if ($i=="=>") print $(i+1)}' \
            | grep -iE 'mingw64|/mingw|msys64' \
            | sort -u > dlls.txt || true

          copied=0
          while IFS= read -r dll; do
            [ -z "$dll" ] && continue
            if [ -f "$dll" ]; then
              cp -f "$dll" release/
              copied=$((copied+1))
            fi
          done < dlls.txt

          echo "Bundled $copied DLLs:"
          ls -1 release/*.dll 2>/dev/null || true

      - name: Verify bundle is self-contained
        shell: msys2 {0}
        run: |
          set -eu
          # Re-resolve the exe from inside release/. Any dependency still
          # pointing into the MSYS2 tree (rather than a DLL we shipped or a
          # Windows system DLL) would be missing on a user's machine -> fail.
          cd release
          ntldd -R gigasheet.exe \
            | awk '{for (i=1;i<=NF;i++) if ($i=="=>") print $(i+1)}' \
            | grep -iE 'mingw64|/mingw|msys64' \
            | grep -viE '[/\\\\]release[/\\\\]' \
            | sort -u > outside.txt || true

          if [ -s outside.txt ]; then
            echo "::error::These DLLs resolve outside the bundle and would be missing on a clean machine:"
            cat outside.txt
            exit 1
          fi
          echo "OK: exe resolves only bundled DLLs + Windows system DLLs."

      - name: Add run instructions
        shell: bash
        run: |
          cat > release/README.txt <<'EOF'
          Gigasheet (Windows build)
          =========================

          To run: unzip this folder anywhere and double-click gigasheet.exe.

          Everything the app needs (the wxWidgets and MinGW runtime DLLs) is
          included in this folder, so no extra installation is required. Keep
          gigasheet.exe together with the .dll files and appicon.png.

          Usage:
            - Open a CSV via the "Open" button to import a dataset, or pass a
              prepared dataset directory as the first argument:
                  gigasheet.exe path\to\dataset_dir
            - Use "Enable Filtering" then click a column header to filter rows.
            - "Add Column" adds derived columns from formulas; "Statistics"
              computes SUM/AVG/MIN/MAX/COUNT over a formula.
          EOF

      - name: Show packaged files
        shell: msys2 {0}
        run: |
          ls -lah release
          echo "Total size:"
          du -sh release

      - name: Create zip
        shell: msys2 {0}
        run: |
          set -euo pipefail
          name="gigasheet-windows-${{ steps.ver.outputs.version }}"
          cd release
          zip -r "../${name}.zip" .
          cd ..
          echo "ZIP_NAME=${name}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gigasheet-windows-${{ steps.ver.outputs.version }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Gigasheet ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
